baseURL = "https://ai-seek-engineer.github.io/frontier-papers/"
languageCode = "zh-CN"
title = "Frontier Papers"

disableKinds = ["taxonomy", "term"]

[markup]
  [markup.highlight]
    noClasses = true
    style = "github"
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]
