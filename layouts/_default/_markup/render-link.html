{{- $href := .Destination -}}
{{- if and (strings.HasPrefix $href "/") (not (strings.HasPrefix $href "//")) -}}
  {{- $href = printf "%s%s" site.Home.RelPermalink (replaceRE "^/+" "" $href) -}}
{{- end -}}
<a href="{{ $href | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>
